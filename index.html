<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polish practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8EBE4; --card:#FCFDFB; --ink:#181B18; --dim:#6C736B; --line:#C9CFC4;
  --ok:#2F6B3E; --bad:#A32C22;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);padding:1.25rem 1rem calc(2rem + env(safe-area-inset-bottom))}
.wrap{max-width:26rem;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.top{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:1.5rem}

#bar{height:2px;background:var(--line);margin:0 0 1.25rem;display:none}
#bar.on{display:block}
#bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s ease}
.stats{background:var(--card);border:1px solid var(--line);padding:1.5rem}
.stats h2{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 1.1rem;font-weight:400}
.rows{display:grid;grid-template-columns:auto 1fr;gap:.45rem 1rem;align-items:baseline}
.rows dt{font-size:.85rem;color:var(--dim)}
.rows dd{margin:0;font-family:var(--mono);font-size:1rem;text-align:right}
.rows dd.big{font-size:1.6rem;font-weight:300;font-family:var(--sans)}
.rows .muted{color:var(--dim)}
.done{text-align:center}
.done-h{font-size:1.35rem;font-weight:300;margin:.5rem 0 .25rem}
.done-sub{color:var(--dim);margin:0 0 1.5rem}
.done-cta{font-family:var(--mono);font-size:.95rem;letter-spacing:.04em;
  color:var(--ok);margin:0 0 1.75rem;padding:.85rem;border:1px solid var(--ok);border-radius:4px}
.rows.small{text-align:left;font-size:.9rem}
.rows.small dd{font-size:.95rem}
.aside{margin:1.5rem 0 0;font-size:.72rem;line-height:1.5;color:var(--dim);opacity:.7}
.foot{margin-top:1.1rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.8rem;color:var(--dim);line-height:1.5}
.msg{text-align:center;padding:3rem 1rem;color:var(--dim);font-size:1rem;line-height:1.6}
.msg-sub{display:inline-block;margin-top:.75rem;font-size:.8rem;opacity:.75}
.msg.err{color:var(--bad);font-family:var(--mono);font-size:.82rem;text-align:left;white-space:pre-wrap}
.warn{margin:0 0 1rem;padding:.6rem .75rem;border:1px solid var(--line);border-left:2px solid var(--bad);font-family:var(--mono);font-size:.7rem;line-height:1.5;color:var(--dim)}
.warn.err{color:var(--bad);background:#F6EDEC}
.gate{background:var(--card);border:1px solid var(--line);padding:1.75rem 1.5rem}
.gate-h{font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bad);margin:0 0 .75rem}
.gate p{margin:0 0 1rem;font-size:.95rem;line-height:1.6;color:var(--dim)}
.gate .reveal{margin-top:.5rem}
.reveal.alt{background:none;color:var(--dim);border:1px solid var(--line)}
.reveal.alt:hover{background:none;border-color:var(--dim);color:var(--ink)}

.card{background:var(--card);border:1px solid var(--line);padding:3rem 1.5rem;text-align:center;min-height:11rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem}
.front{font-size:2.1rem;font-weight:300}
.back{font-size:1.3rem;color:var(--dim)}
.card img{max-width:100%;max-height:9rem;margin-top:.5rem;border-radius:4px}
.ipa{font-family:var(--mono);font-size:.85rem;color:var(--dim)}
.play-big{width:4.5rem;height:4.5rem;font-size:1.6rem}
.task{font-size:1rem;color:var(--dim);margin-bottom:.25rem}
.task-sub{font-family:var(--mono);font-size:.68rem;line-height:1.5;color:var(--dim);opacity:.75;margin-bottom:.5rem}
.sent-gap{font-size:1.1rem;line-height:1.5;color:var(--ink)}
.sent{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line);width:100%}
.sent-pl{font-size:1.05rem;line-height:1.5;display:flex;align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap}
.sent-pl .play{width:2rem;height:2rem;font-size:.75rem;flex:none}
.sent-en{font-size:.85rem;color:var(--dim);margin-top:.35rem}
.gram{margin-top:1rem;padding-top:.75rem;border-top:1px solid var(--line);width:100%;font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;color:var(--dim)}
.note{margin-top:.5rem;font-size:.8rem;color:var(--dim);font-style:italic}
.play{background:none;border:1px solid var(--line);border-radius:50%;width:2.5rem;height:2.5rem;font-size:1rem;cursor:pointer;color:var(--ink)}
.play:hover{border-color:var(--dim)}

button{font-family:inherit;cursor:pointer;border-radius:4px}
.reveal{display:block;width:100%;margin-top:1.25rem;padding:1rem;background:var(--ink);color:var(--card);border:0;font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
.reveal:hover{background:#2c322c}
.grades{display:flex;gap:.6rem;margin-top:1.25rem}
.grades button{flex:1;padding:1rem;border:1px solid var(--line);background:var(--card);font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.g-again{color:var(--bad)} .g-again:hover{border-color:var(--bad)}
.g-good{color:var(--ok)} .g-good:hover{border-color:var(--ok)}

/* ── landing: pick a mode ─────────────────────────────────────────── */
.modes{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.25rem}
.mode{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  padding:1.1rem 1.25rem;color:var(--ink)}
.mode:hover{border-color:var(--dim)}
.mode-n{font-size:1.1rem;font-weight:300}
.mode-sub{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;color:var(--dim);text-align:right}
.mode.lead{background:var(--ink);border-color:var(--ink);color:var(--card)}
.mode.lead .mode-sub{color:var(--line)}
.mode.is-done{background:none;border-style:dashed;color:var(--dim);cursor:default}
.mode.is-done:hover{border-color:var(--line)}
.mode.is-done .mode-n{font-weight:400}

.lighter{display:block;width:100%;margin:-.2rem 0 0;padding:.6rem;background:none;
  border:0;color:var(--dim);font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;
  text-align:center;text-decoration:underline;text-underline-offset:3px}
.lighter:hover{color:var(--ink)}
/* The drill is an <a>, not a <button>, so it needs the type reset too. */
.lighter.drill{text-decoration:none;text-align:center;margin-top:.6rem}


/* ── the sibilant hint sheet ──────────────────────────────────────── */
.hint-btn{display:block;width:100%;margin-top:1.25rem;padding:.8rem;background:var(--card);
  border:1px solid var(--line);border-radius:4px;color:var(--dim);font-family:var(--mono);
  font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.hint-btn:hover{border-color:var(--dim);color:var(--ink)}
.hint-btn b{color:var(--ink);font-weight:400;letter-spacing:.04em}
.sheet{position:fixed;inset:0;background:var(--paper);z-index:50;overflow-y:auto;
  padding:1.25rem 1rem calc(2rem + env(safe-area-inset-bottom))}
.sheet-in{max-width:26rem;margin:0 auto}
.sheet h3{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-weight:400;margin:1.6rem 0 .5rem}
.sheet h3:first-of-type{margin-top:1rem}
.sheet p{font-size:.9rem;line-height:1.6;margin:0 0 .7rem}
.snd-row{display:flex;align-items:center;gap:.75rem;background:var(--card);
  border:1px solid var(--line);padding:.7rem .9rem;margin-bottom:.5rem}
.snd-row b{font-size:1.6rem;font-weight:300;min-width:2.2rem}
.snd-row .d{flex:1;font-size:.82rem;line-height:1.45;color:var(--dim)}
.snd-row .d em{font-style:normal;color:var(--ink)}
.three-up{display:flex;gap:.4rem}
.three-up button{flex:1;background:var(--card);border:1px solid var(--line);padding:.7rem .3rem;
  font-family:inherit}
.three-up button:hover{border-color:var(--dim)}
.three-up .w{display:block;font-size:1.15rem;font-weight:300}
.three-up .s{display:block;font-family:var(--mono);font-size:.6rem;color:var(--dim);
  letter-spacing:.08em;margin-top:.2rem}
.sheet .close{display:block;width:100%;margin-top:1.5rem;padding:.9rem;background:var(--ink);
  color:var(--card);border:0;border-radius:4px;font-family:var(--mono);font-size:.75rem;
  letter-spacing:.14em;text-transform:uppercase}

/* ── ear training ─────────────────────────────────────────────────── */
.ticks{display:flex;gap:3px;margin-bottom:1rem}
.ticks i{flex:1;height:3px;background:var(--line)}
.ticks i.hit{background:var(--ink)}
.ticks i.miss{background:var(--bad)}
.player{width:100%;background:var(--card);border:1px solid var(--line);
  padding:1.5rem 1rem 1.1rem;margin-bottom:1.25rem;display:block;color:var(--ink)}
.player:hover{border-color:var(--dim)}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:52px}
.bars span{width:3px;background:var(--dim);opacity:.45;transform-origin:bottom;transition:opacity .2s}
.player.playing .bars span{opacity:1;background:var(--ink);animation:hiss .55s ease-in-out infinite alternate}
@keyframes hiss{from{transform:scaleY(.35)}to{transform:scaleY(1.35)}}
@media (prefers-reduced-motion:reduce){.player.playing .bars span{animation:none}}
.player-label{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);margin-top:1rem;text-align:center;display:block}
.opts{display:flex;flex-direction:column;gap:.6rem}
.opt{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  padding:.95rem 1.1rem;display:flex;align-items:center;gap:1rem;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--dim)}
.opt-main{flex:1;min-width:0}
.opt-word{font-size:1.7rem;line-height:1.15;font-weight:300;color:var(--dim);display:block}
.opt-word mark{background:none;color:var(--ink);font-weight:700}
.opt-gloss{font-family:var(--mono);font-size:.74rem;color:var(--dim);margin-top:.3rem;display:block}
.opt-ipa{font-family:var(--mono);font-size:.9rem;color:var(--dim)}
.opt:disabled{cursor:default;opacity:1}
.opt.correct{border-color:var(--ok);background:#F1F7F1}
.opt.correct .opt-ipa{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:#FBF1F0}
.opt.wrong .opt-ipa{color:var(--bad)}
.opt.faded{opacity:.4}
.verdict{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;
  margin:1.25rem 0 .5rem;text-align:center;min-height:1.1rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.compare{display:flex;gap:.6rem;margin-top:.75rem}
.compare button{flex:1;background:none;border:1px solid var(--line);padding:.7rem .4rem;color:var(--ink)}
.compare button:hover{border-color:var(--dim)}
.compare .lbl{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);display:block}
.compare .wd{font-size:1.15rem;display:block;margin-top:.25rem}
.missed{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.78rem;margin-top:.5rem}
.missed td{padding:.4rem .3rem;text-align:left;border-bottom:1px solid var(--line);color:var(--dim)}
.missed td:last-child{text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="eyebrow" id="mode-label">Polish</span>
    <span class="eyebrow" id="count"></span>
  </div>
  <div id="bar"><i></i></div>
  <div id="warn"></div>
  <div id="app"><p class="msg">Loading…</p></div>
</div>

<script type="module">
/* ══════════════════════════════════════════════════════════════════
   Firebase project config — console → gear → Project settings → your
   web app → SDK setup and configuration. Not a secret: Firestore access
   is governed by the rule on the collection, not by this key.
   ══════════════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyAZD5VoyBU22jaSBpajmbUiO-ZW8WDkEEo",
  authDomain: "flashcards-f5b40.firebaseapp.com",
  projectId: "flashcards-f5b40",
  storageBucket: "flashcards-f5b40.firebasestorage.app",
  messagingSenderId: "24461231038",
  appId: "1:24461231038:web:87e1160e6008d9d6b0efef"
};

/* ══════════════════════════════════════════════════════════════════
   EAR TRAINING CONTENT — the one part of this file meant to be edited.

   Vocabulary lives in deck/notes.json, but minimal pairs live here,
   because tools/ear_build.py and tools/ear_split.py read the WORDS and
   SETS literals straight out of this file, to name the recording folders
   and to print the record-order sheet. Both parse them with a regex that
   wants each declaration opened on its own line and closed on a line of
   its own; keep the shape below and they keep working.

   Pairs are not vocabulary — like kind:"form" notes they never enter
   deck/vocab.csv, so the word count stays honest.

   w:  [before, the consonant, after] — the middle part gets highlighted
   s:  which sound, for the IPA badge and the confusion matrix
   g:  English gloss
   ══════════════════════════════════════════════════════════════════ */
const WORDS = {
  "kos":        {w:["ko","s",""],    g:"blackbird",           s:"s"},
  "kosz":       {w:["ko","sz",""],   g:"basket",              s:"sz"},
  "kos-acute":  {w:["ko","ś",""],    g:"mow! (imperative)",   s:"si"},

  "pas":        {w:["pa","s",""],    g:"belt",                s:"s"},
  "pasz":       {w:["pa","sz",""],   g:"of fodder",           s:"sz"},
  "pas-acute":  {w:["pa","ś",""],    g:"graze! (imperative)", s:"si"},

  "kasa":       {w:["ka","s","a"],   g:"till, cash desk",     s:"s"},
  "kasza":      {w:["ka","sz","a"],  g:"groats, kasha",       s:"sz"},
  "kasia":      {w:["Ka","si","a"],  g:"Katie",               s:"si"},

  "sok":        {w:["","s","ok"],    g:"juice",               s:"s"},
  "szok":       {w:["","sz","ok"],   g:"shock",               s:"sz"},

  "sum":        {w:["","s","um"],    g:"catfish",             s:"s"},
  "szum":       {w:["","sz","um"],   g:"hum, rustle",         s:"sz"},

  "syk":        {w:["","s","yk"],    g:"hiss",                s:"s"},
  "szyk":       {w:["","sz","yk"],   g:"word order",          s:"sz"},

  "prosze":     {w:["pro","sz","ę"], g:"please",              s:"sz"},
  "prosie":     {w:["pro","si","ę"], g:"piglet",              s:"si"},

  "wiesz":      {w:["wie","sz",""],  g:"you know",            s:"sz"},
  "wies-acute": {w:["wie","ś",""],   g:"village",             s:"si"},

  "sad":        {w:["","s","ad"],    g:"orchard",             s:"s"},
  "siad":       {w:["","si","ad"],   g:"sitting position",    s:"si"},

  "nos":        {w:["no","s",""],    g:"nose",                s:"s"},
  "nos-acute":  {w:["no","ś",""],    g:"carry! (imperative)", s:"si"},

  /* c · cz · ć — approved 2026-08-18, recordings still to come. Until the
     audio lands these pairs are skipped automatically. */
  "nic":        {w:["ni","c",""],    g:"nothing",             s:"c"},
  "nic-acute":  {w:["ni","ć",""],    g:"thread",              s:"ci"},

  "czy":        {w:["","cz","y"],    g:"whether",             s:"cz"},
  "ci":         {w:["","ci",""],     g:"to you",              s:"ci"},

  "car":        {w:["","c","ar"],    g:"tsar",                s:"c"},
  "czar":       {w:["","cz","ar"],   g:"charm, spell",        s:"cz"},

  "moc":        {w:["mo","c",""],    g:"power, might",        s:"c"},
  "mocz":       {w:["mo","cz",""],   g:"urine",               s:"cz"},

  "piec":       {w:["pie","c",""],   g:"oven, stove",         s:"c"},
  "piecz":      {w:["pie","cz",""],  g:"bake! (imperative)",  s:"cz"},

  "leci":       {w:["le","ci",""],   g:"flies, is flying",    s:"ci"},
  "leczy":      {w:["le","cz","y"],  g:"heals, treats",       s:"cz"},

  "place":      {w:["pła","c","e"],  g:"wages",               s:"c"},
  "placze":     {w:["pła","cz","e"], g:"cries, weeps",        s:"cz"},

  "owca":       {w:["ow","c","a"],   g:"sheep",               s:"c"},
  "owcza":      {w:["ow","cz","a"],  g:"ovine, sheep's",      s:"cz"}
};

/* One row per contrast family. A row of three is three separate pairs at
   runtime — see PAIRS below for why. */
const SETS = [
  ["kos","kosz","kos-acute"],
  ["pas","pasz","pas-acute"],
  ["kasa","kasza","kasia"],
  ["sok","szok"],
  ["sum","szum"],
  ["syk","szyk"],
  ["prosze","prosie"],
  ["wiesz","wies-acute"],
  ["sad","siad"],
  ["nos","nos-acute"],

  ["nic","nic-acute"],
  ["czy","ci"],
  ["car","czar"],
  ["moc","mocz"],
  ["piec","piecz"],
  ["leci","leczy"],
  ["place","placze"],
  ["owca","owcza"]
];
/* ── end of ear content ───────────────────────────────────────────── */

/* ══════════════════════════════════════════════════════════════════
   Below here you shouldn't need to touch anything. Vocabulary lives in
   deck/notes.json — adding a word means editing that file, not this
   one. Run tools/validate.py after a deck edit and tools/smoke.mjs
   after any edit to this file.
   ══════════════════════════════════════════════════════════════════ */

const $ = sel => document.querySelector(sel);
const appEl = $("#app"), countEl = $("#count"), warnEl = $("#warn");

function showError(msg){
  appEl.innerHTML = `<p class="msg err">${msg}</p>`;
}

const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js");
const { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion, FieldPath } =
  await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js");

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ── identity: the link is the login ──────────────────────────────
   No signup, no password. The URL carries a long random ID; whoever
   has the link has the data. Fine for a private study tool, not a
   real access-control system — see the README note on this.

   Opening the wrong link silently starts an empty deck, which is the one
   genuinely confusing failure this design allows. So both odd cases —
   no id at all, and a URL id that disagrees with the one last used on this
   device — stop and say so before any reviewing happens. */
function getUserId(){
  const params = new URLSearchParams(location.search);
  const fromUrl = params.get("u");
  const stored  = localStorage.getItem("vocab-uid");

  /* ?u=<id>&peek — look at a real student's deck without touching it.
     Deliberately does not write localStorage and does not run the identity
     gate below: this is an explicit act of looking at someone else's data,
     not a claim to be them. Without that, opening a student's link to check
     on him would silently make the teacher's own browser that student. */
  if (params.has("peek")) return { id: fromUrl, stored, alert: null, peek: true };

  if (!fromUrl && !stored) {
    const id = crypto.randomUUID();
    history.replaceState(null, "", "?u=" + id);
    return { id, stored, alert: "new" };
  }
  if (fromUrl && stored && fromUrl !== stored) {
    // Deliberately does NOT overwrite the stored id: if this is a misclick
    // on an old link, the usual session stays recoverable.
    return { id: fromUrl, stored, alert: "switched" };
  }
  const id = fromUrl || stored;
  // Put a localStorage-recovered id back in the URL so the link stays copyable.
  if (!fromUrl) history.replaceState(null, "", "?u=" + id);
  localStorage.setItem("vocab-uid", id);
  return { id, stored, alert: null };
}

function confirmIdentity(alert, id, stored){
  return new Promise(resolve => {
    countEl.textContent = "";
    appEl.innerHTML = alert === "new" ? `
      <div class="gate">
        <p class="gate-h">New, empty deck</p>
        <p>This link has no saved progress on it. If you have used this
        trainer before, close this and open your usual bookmarked link —
        carrying on here will start you from zero.</p>
        <button class="reveal" id="go">Start a new deck anyway</button>
      </div>` : `
      <div class="gate">
        <p class="gate-h">Different deck</p>
        <p>This link is not the one you last used on this device. Your
        progress is not lost — it is on the other link.</p>
        <button class="reveal" id="back">Go to my usual deck</button>
        <button class="reveal alt" id="go">Use this link instead</button>
      </div>`;
    $("#go").addEventListener("click", () => {
      localStorage.setItem("vocab-uid", id);
      resolve();
    });
    const back = $("#back");
    if (back) back.addEventListener("click", () => {
      location.search = "?u=" + stored;
    });
  });
}

const { id: uid, stored: storedUid, alert: idAlert, peek } = getUserId();
const PEEK = !!peek;
if (PEEK && !uid) {
  showError("Peek needs a deck to look at.\n\nUse ?u=<their id>&peek");
  throw new Error("peek without a target");
}
/* Any id beginning "test" is a scratch session: it reviews normally but
   never writes, so poking at the app does not leave documents behind. */
const TEST_MODE = /^test/i.test(uid);
/* Both never write. They differ in what they show: a test session is a
   scratch deck of its own and skips the maturity gate so every card type is
   visible at once, while a peek shows exactly what the student would see,
   gate and all — a preview that lied about the gate would be worthless. */
const READ_ONLY = TEST_MODE || PEEK;
if (idAlert) await confirmIdentity(idAlert, uid, storedUid);
const docRef = doc(db, "progress", uid);

/* Every write in this file goes through `write`, and in a read-only session
   both members are stubs. The per-caller READ_ONLY checks below are belt to
   this braces: peek points at real student progress, so "nothing can write"
   has to be a property of the plumbing rather than a promise each caller
   remembers to keep. */
const write = READ_ONLY
  ? { set: async () => {}, update: async () => {} }
  : { set: setDoc, update: updateDoc };

/* ── SM-2-lite scheduling ──────────────────────────────────────────
   Two grades only: again / good. Ease starts at 2.5 and only moves
   on a lapse. Intervals: 1 day, 6 days, then ivl * ease. This is a
   deliberately simplified SM-2 — no Hard/Easy, no sub-day learning
   steps. A card marked "again" is also nudged back into today's
   session queue so it comes up again this sitting, not just tomorrow. */
const MS_DAY = 86400000;

/* ── cards per note ────────────────────────────────────────────────
   One note will eventually spawn several cards (recognition, production,
   listening, cloze). Only recognition exists today, but scheduling state is
   keyed per *card* from the start, so adding a type later is a data change
   rather than a migration of live progress.

   Keys are `${noteId}__${cardType}`. Keep note ids to [A-Za-z0-9_]: the key
   is used as a Firestore field path in save(), and anything outside that
   set would need backtick quoting. */
const cardKey = (noteId, type) => `${noteId}__${type}`;
const noteOf  = key => key.slice(0, key.lastIndexOf("__"));
const typeOf  = key => key.slice(key.lastIndexOf("__") + 2);
/* Which cards a note produces is data, not code — set `cards` in
   deck/notes.json. A type whose material is missing is dropped rather than
   rendering a blank card: no audio means no listening card, since its whole
   front is the recording. */
const NEEDS = {
  listening: n => n.audio,
};
function typesFor(note){
  return (note.cards || ["recognition"]).filter(t => !NEEDS[t] || NEEDS[t](note));
}

/* Daily intake: a total in *cards*, with a reservation for new *words* inside
   it. Two numbers, and they answer two different questions.

   `NEW_CARDS_PER_DAY` is the time knob. Cards are what cost minutes, and the
   plateau of the whole system is (cards introduced per day) x (answers a card
   costs before it retires), so this is the number that decides how long a
   session eventually takes.

   `NEW_WORDS_PER_DAY` is the teaching knob — three a day, matched to what he
   meets in a lesson. It is a *reservation*, not a second pool: new words are
   taken first so that an unlocking backlog can never crowd vocabulary out
   entirely, which is the failure this budget has always existed to prevent.

   **Ten, because the sibling arrival rate is not a free parameter.** Measured
   over the deck, a word note carries 1.99 siblings, so three words a day
   generate six sibling cards a day, for ever. The old design capped siblings
   separately at five — below the arrival rate — so one card a day was
   deferred permanently rather than smoothed, and 43 cards had piled up behind
   it by 2026-09-09, listening worst. A queue served at its arrival rate never
   empties; it has to be served faster. Nine is the steady state, so ten leaves
   exactly enough headroom to drain a backlog at one a day, and to absorb a
   lump without one forming.

   The first session gets a larger allowance because there is nothing to review
   yet and finishing after two cards feels like the app is broken — a day-one
   problem, not a reason to top up every quiet day afterwards. No siblings can
   exist that day, so one number covers it. */
const NEW_WORDS_PER_DAY = 3;
const NEW_CARDS_PER_DAY = 10;
const FIRST_SESSION_WORDS = 10;

/* Firestore caps a document at 1 MiB. We warn well before that; see
   logBytes() for why the estimate errs high. */
const DOC_LIMIT = 1048576;
const WARN_AT   = 0.7;

function today(){ const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function newCardState(){ return { ivl: 0, ease: 2.5, reps: 0, due: today() }; }
/* Jitter, so that words introduced together do not come back together for
   ever. Nothing in the scheduler was random: two cards answered correctly on
   the same day had byte-identical intervals from then on, so a batch marched
   in lockstep. Measured on 2026-09-09, all 8 cards introduced on 31 August
   were due on the same day, and 10 of the 13 from 5 September.

   That is two problems. The load arrives in spikes — his next three weeks ran
   0, 12, 23, 2, 15, 3 … — and, worse, a cohort carded together stays together,
   which is the interference that took `często` to the ease floor.

   **The due date is jittered; the interval is not.** `ivl` is load-bearing in
   three other places — RETIRE_IVL, the maturity buckets in progress.py, and
   until today the unlock gate — and fuzzing it would move a card across those
   boundaries for no reason. Moving only the day it comes back leaves every
   one of them exact.

   It still compounds, which is the point: he answers on the jittered day, and
   the next interval is counted from there, so a cohort's spread is a random
   walk rather than a fixed offset.

   5%, floor one day. Simulated over a cohort of nine for 400 days, the worst
   single day falls from 6.6 cards to 4.7; 10% gives 4.6 and 25% gives 4.2, so
   nearly all of it is bought by the first 5% and the rest distorts the
   schedule for very little. Intervals below 6 are left alone — reps 1 always
   means "tomorrow", and there is nothing to spread there.

   Derived from the card and its state rather than Math.random, so it is a
   pure function: the same card in the same state always gets the same offset,
   which is what makes it testable. */
const FUZZ = 0.05;
function fuzzDays(key, s){
  if (s.ivl < 6) return 0;
  const f = Math.max(1, Math.round(s.ivl * FUZZ));
  let h = 2166136261;
  for (const ch of `${key}:${s.reps}:${s.ivl}`)
    h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return ((h >>> 0) % (2 * f + 1)) - f;
}

function schedule(state, grade, key){
  const s = { ...state };
  if (grade === "again") {
    s.reps = 0;
    s.ease = Math.max(1.3, s.ease - 0.2);
    s.ivl = 1;
    s.due = today() + MS_DAY;
  } else {
    s.reps += 1;
    /* Ease recovers, but has to be earned. A lapse costs 0.2 in one moment;
       a success returns 0.15, and only from the third in a row — which is
       also the point at which ease starts affecting the interval at all.
       Without this, ease only ever fell: a word failed during a bad
       fortnight stayed on short intervals for good, long after it was
       learned. Climbing from the 1.3 floor back to 2.5 takes ten consecutive
       correct answers, which is a demonstration rather than a gift. */
    if (s.reps >= 3) s.ease = Math.min(2.5, s.ease + 0.15);
    if (s.reps === 1) s.ivl = 1;
    else if (s.reps === 2) s.ivl = 6;
    else s.ivl = Math.round(s.ivl * s.ease);
    s.due = today() + (s.ivl + fuzzDays(key, s)) * MS_DAY;
  }
  return s;
}

/* ── load, build today's queue ─────────────────────────────────── */
/* ── the deck ───────────────────────────────────────────────────────
   deck/notes.json is the single source of truth for card content, fetched
   rather than inlined so adding a word never means editing this file.
   Validate it with tools/validate.py before pushing. */
let NOTES;
try {
  const res = await fetch("deck/notes.json", { cache: "no-cache" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const deck = await res.json();
  if (deck.schema !== 1) throw new Error(`unexpected schema version ${deck.schema}`);
  if (!Array.isArray(deck.notes) || !deck.notes.length) throw new Error("no notes in deck");
  NOTES = Object.fromEntries(deck.notes.map(n => [n.id, n]));
} catch (e) {
  showError("Couldn't load the deck (deck/notes.json).\n\n" + e.message +
    "\n\nIf you opened this file straight from disk, that's the reason —\n" +
    "the deck is fetched over HTTP. Use the GitHub Pages link instead.");
  throw e;
}

let cardStates = {};
let reviewLog = [];
/* Ear-training state is deliberately NOT in `cards`. The vocab queue, the
   daily budgets, the unlock gates and sibling burying all assume note-cards;
   a perceptual drill keyed by confusion pair has no business in there, and
   putting it there would risk live progress for no gain. */
let earStates = {};
/* Which modes were finished on which day, so a reload or his other device
   does not re-offer a session he has already done. Same reasoning as the
   `introduced` stamps on card state. */
let doneDays = {};
/* How often he opens the sibilant reminder, per day. Deliberately NOT in the
   review log: progress.py buckets that by `grade` for the streak, the day
   counts and the accuracy, and a non-review entry would corrupt all three. */
let hintOpens = {};
// Declared here, not with the rest of the extra-study state further down:
// the loader below fills both, and a `let` assigned before its declaration
// is evaluated throws. It did — the page failed to boot with
// "can't access lexical declaration 'extraRuns' before initialization".
let extraRuns = {};
let docExists = false;
try {
  const snap = await getDoc(docRef);
  docExists = snap.exists();
  cardStates = docExists ? (snap.data().cards || {}) : {};
  reviewLog = docExists ? (snap.data().log || []) : [];
  earStates = docExists ? (snap.data().ear || {}) : {};
  doneDays  = docExists ? (snap.data().done || {}) : {};
  hintOpens = docExists ? (snap.data().hints || {}) : {};
  extraRuns = docExists ? (snap.data().extra || {}) : {};
} catch (e) {
  showError("Couldn't reach Firestore.\n\n" + e.message +
    "\n\nCheck: the config is correct, Firestore is enabled, and the\n" +
    "security rule (see top of this file) has been published.");
  throw e;
}

/* State written before cards-per-note existed is keyed by bare note id.
   Fold it into the recognition card so nobody loses their progress. */
let migrated = false;
for (const key of Object.keys(cardStates)) {
  if (key.includes("__")) continue;
  cardStates[cardKey(key, "recognition")] = cardStates[key];
  delete cardStates[key];
  migrated = true;
}

const t = today();

const allCards = Object.values(NOTES).flatMap(
  n => typesFor(n).map(type => cardKey(n.id, type))
);

/* `introduced` is stamped on a card's first grade, so these counts survive a
   reload and a second device. A word counts as introduced on the day its
   *first* card was, not each time another of its types starts. */
const firstSeen = {};
for (const [k, st] of Object.entries(cardStates)) {
  if (st.introduced == null) continue;
  const n = noteOf(k);
  firstSeen[n] = Math.min(firstSeen[n] ?? Infinity, st.introduced);
}
const wordsToday = Object.values(firstSeen).filter(d => d === t).length;
const siblingsToday = Object.entries(cardStates)
  .filter(([k, st]) => st.introduced === t && firstSeen[noteOf(k)] < t).length;
const everStudied = reviewLog.length > 0;
const wordBudget = Math.max(0,
  (everStudied ? NEW_WORDS_PER_DAY : FIRST_SESSION_WORDS) - wordsToday);
const cardBudget = Math.max(0,
  (everStudied ? NEW_CARDS_PER_DAY : FIRST_SESSION_WORDS)
  - wordsToday - siblingsToday);

/* Order. Sorting by due date alone left the sequence identical every
   session and introduced new words in file order, so the last notes in the
   file would wait for every earlier one. Both are worth avoiding: fixed
   order lets a word be recalled from its neighbour rather than on its own.

   The shuffle is seeded on the day plus the user id, so it is stable across
   a reload — refreshing mid-session should not reshuffle the deck under him
   — but different tomorrow, and different per student. */
function rng(seed){
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let x = Math.imul(a ^ (a >>> 15), 1 | a);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
const daySeed = [...(uid + ":" + t)].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261);
const rand = rng(daySeed);

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* Staged unlock, per type. Meeting a brand-new word in three directions at
   once mostly generates failures, so the harder types wait until the
   recognition card has been answered correctly a few times running:

     production  2 in a row   the day after the word is introduced
     listening   3 in a row   a week in

   Listening is pushed further back deliberately: reading gives him the
   spelling to lean on, and the recording gives him nothing, so ear training
   wants a firmer foundation than production does.

   **Counted in reps, not in the interval, and that is a bug fix.** These were
   `ivl >= 6` and `ivl >= 15`, chosen because a clean card runs 1, 6, 15, 38 —
   but only a card at the full 2.5 ease lands on exactly 15. One that has ever
   lapsed computes `round(6 * 2.35) = 14` and misses the gate, so listening
   waited an entire extra step: 33 days instead of 15. On 2026-09-09 six of his
   cards were sitting there, and they were his hardest — być, chcieć, wiedzieć,
   iść, płacić, ręka — the words most in need of the card being withheld. Reps
   say what was always meant and cannot be undershot.

   The gate only governs *introducing* a card. Once a card has state it stays
   in rotation, so a later lapse on recognition does not yank away work
   already under way. */
const UNLOCK_REPS = { production: 2, listening: 3 };

function unlocked(key){
  // A scratch session is for looking at the app, not for learning — waiting
  // a week to see a production card would defeat the point.
  // A peek must show the gate, not skip it — see READ_ONLY above.
  if (TEST_MODE) return true;
  const n0 = NOTES[noteOf(key)];
  /* A conjugation drill waits on the verb it conjugates, not on itself —
     it has no recognition card of its own to mature. */
  if (n0 && n0.kind === "form") {
    const base = cardStates[cardKey(n0.parent, "recognition")];
    return !!base && base.reps >= UNLOCK_REPS.production;
  }
  const need = UNLOCK_REPS[typeOf(key)];
  if (need === undefined) return true;
  const note = NOTES[noteOf(key)];
  // A note that produces no recognition card has nothing to gate against.
  if (!typesFor(note).includes("recognition")) return true;
  const base = cardStates[cardKey(noteOf(key), "recognition")];
  return !!base && base.reps >= need;
}

/* At most one *new* card per note per day. A note's cards are siblings —
   answering one gives away the others — so introducing three at once would
   waste two of them. Burying (see grade) enforces the same rule for reviews;
   this stops the daily budget being spent on cards that would be buried. */
const started = new Set(Object.keys(cardStates).map(noteOf));
const isForm = k => (NOTES[noteOf(k)] || {}).kind === "form";

/* Which words come out of the bank first. A note marked `priority: true` in
   deck/notes.json is introduced ahead of the rest — for the words from a
   lesson, so the story he has just been told is what turns up next.

   Deliberately narrow. It reorders the *bank* of not-yet-seen cards and
   nothing else: reviews are untouched, the daily budgets are untouched, and
   it does not bypass the maturity gate below — a prioritised production card
   still waits for its recognition card to mature, or "priority" would come
   to mean "show three cards for a word he met yesterday", which is what
   burying and gating exist to prevent.

   The sort is stable, so the day's shuffle survives inside each band: the
   prioritised words still arrive in a different order every day.

   It needs no cleaning up. Priority only affects cards with no state yet, so
   the flag goes inert the moment a word is introduced. */
function bankOrder(cards){
  const prio = k => (NOTES[noteOf(k)] || {}).priority ? 1 : 0;
  return cards.slice().sort((a, b) => prio(b) - prio(a));
}

/* Whether a card may come out of the bank at all. A note no human has read
   must never reach him: the app is served straight from the repo, so without
   this the only thing between a half-written sentence and the student is
   remembering not to push. Strict — the flag must be exactly true — so a
   note that loses the key is withheld rather than quietly shipped;
   validate.py refuses a deck where it is missing, so this cannot go unseen. */
function introducible(k){
  return (NOTES[noteOf(k)] || {}).reviewed === true;
}

/* Retirement. A card whose interval has reached RETIRE_IVL leaves rotation
   for good and is never shown again.

   It is needed because intervals grow but the deck grows too, and the deck
   wins. `ivl * ease` is unbounded — a card answered right forever runs 1, 6,
   15, 38, 95, 238, 595 days — so each card's cost does decay, just not fast
   enough to offset a word a day arriving behind it. Without retirement the
   daily session grows without limit: simulated on his real numbers, three
   words a day reaches 13 minutes at one year and 20 at five, and is still
   climbing. With retirement it flattens.

   180 days rather than a rounder number because the thresholds are not
   continuous. The interval ladder above means every threshold from 96 to 238
   retires a card at exactly the same moment — the sixth consecutive correct
   answer, about eight months in. 180 is the middle of that band and says what
   it means: six in a row, and we stop asking. 365 would sit in the *next*
   band and cost a quarter more reviews per card for one extra look every
   twenty months.

   Derived, never stored. There is no `retired` flag on card state, no
   migration and no write: lowering or raising this constant brings cards back
   or sends them away on the next load. A stored flag would make the decision
   irreversible, which is the wrong shape for a number chosen by simulation.

   The consequence to be honest about: a retired card is never shown, so its
   interval never changes, so nothing can un-retire it. This is a claim that
   six correct answers spread over eight months means the word is his. If that
   turns out to be wrong, the evidence will be indirect — a retired word
   failing inside a sentence on another card — and the remedy is to lower this
   number, or to withdraw the note and let it come round again. */
const RETIRE_IVL = 180;
/* `cardRetired`, not `retired`: the ear trainer already owns that name for
   pair retirement, and index.html is one module scope shared by both halves,
   so the clash is a SyntaxError that kills the whole app on load. smoke.mjs
   caught it. */
function cardRetired(k){
  const st = cardStates[k];
  return !!st && st.ivl >= RETIRE_IVL;
}
/* New cards used to be appended, so every one of them arrived at the end of
   the session: the most effortful cards landing when he is most tired, and
   the gapped production cards clustering worst of all, since they unlock
   later than recognition and so are the ones most often still new. Spread
   them through the reviews instead, after a short warm-up.

   Due cards keep their own order — due date dominates, ties broken by the
   day's shuffle — this only decides where the new ones are dropped in. */
const WARMUP_REVIEWS = 3;
function interleave(due, neu){
  if (!neu.length || !due.length) return [...due, ...neu];
  const out = [...due];
  const start = Math.min(WARMUP_REVIEWS, out.length);
  const step = (out.length - start) / neu.length;
  // +i because each splice shifts every later position along by one.
  neu.forEach((k, i) => out.splice(Math.round(start + step * i) + i, 0, k));
  return out;
}
/* ── end of bank order ─────────────────────────────────────────────── */

const ordered = bankOrder(shuffle([...allCards]));
const rank = new Map(ordered.map((k, i) => [k, i]));
const freshSeen = new Set();
const fresh = [];
let lockedCount = 0, words = 0, siblings = 0;
/* Two passes over the same list. New words claim their reservation first,
   then siblings take whatever is left of the day's total — that ordering is
   the whole point of having a word budget at all, and a single pass could
   spend the day's cards on a sibling backlog before reaching any new word. */
for (const wantWords of [true, false]) {
  for (const k of ordered) {
    if (cardStates[k]) continue;
    /* Sits after the state check, so it can only ever withhold a card never
       seen — a flag cleared by accident (audio.py did exactly that once)
       cannot yank back work under way, the rule the maturity gate follows too.
       Not counted as locked: locked means waiting on his own progress, and
       this is waiting on the teacher. */
    if (!introducible(k)) continue;
    if (!unlocked(k)) { if (wantWords) lockedCount++; continue; }
    if (freshSeen.has(noteOf(k))) continue;        // one card per note per day
    /* A conjugation drill is not new vocabulary — the form was taught in the
       lesson — so it counts as a sibling rather than against the word
       reservation, and trickles in like any other card. */
    const isNewWord = !isForm(k) && !started.has(noteOf(k));
    if (isNewWord !== wantWords) continue;
    if (words + siblings >= cardBudget) break;
    if (isNewWord && words >= wordBudget) continue;
    isNewWord ? words++ : siblings++;
    freshSeen.add(noteOf(k));
    fresh.push(k);
  }
}
// Back into bank order, so the two passes do not arrive as two blocks.
fresh.sort((a, b) => rank.get(a) - rank.get(b));

const dueCards = shuffle(allCards.filter(
    k => cardStates[k] && cardStates[k].due <= t && !cardRetired(k)))
  .sort((a, b) => cardStates[a].due - cardStates[b].due);
let queue = interleave(dueCards, fresh);
/* A "just reviews" session drops the new cards. Skipping them creates no
   debt: the daily budget is counted from `introduced` stamps, so tomorrow
   is three again rather than six. A tired day must not buy a punishing one. */
let vocabLight = false;

let current = null;
let revealed = false;

/* ── persistence ───────────────────────────────────────────────────
   Write a delta, not the whole document. The previous setDoc re-uploaded
   every card state *and* the entire review log on every single grade — a
   few hundred KB per button press once the log is long, which is felt on a
   phone long before the 1 MiB document ceiling is anywhere in sight. */
// updateDoc requires an existing document; first run has to create one.
async function firstWrite(){
  await write.set(docRef, {
    cards: cardStates, ear: earStates, done: doneDays, hints: hintOpens,
    extra: extraRuns,
    log: reviewLog, logBytes: logBytes(), updated: Date.now()
  });
  docExists = true;
}

async function save(key, state, entry){
  if (READ_ONLY) return;
  if (!docExists) return firstWrite();
  await write.update(docRef, {
    [`cards.${key}`]: state,
    // arrayUnion is set-semantics: an entry identical in card, grade *and*
    // millisecond timestamp would be dropped. Not reachable in practice.
    log: arrayUnion(entry),
    logBytes: logBytes(),
    updated: Date.now(),
  });
}

/* JSON length runs a little above Firestore's own accounting, which is the
   safe direction for a warning. Also stored on the document each save, so
   the number is visible in the Firebase console without opening the app. */
function logBytes(){ return JSON.stringify(reviewLog).length; }

/* Grading used to await the server ack before drawing the next card, which
   put a visible stall on every button press. Writes now go out behind the
   UI, chained so they stay ordered and so two fast grades can't both take
   the "document doesn't exist yet" branch in save(). The Firestore SDK
   retries a queued write on its own; what it can't survive is the tab being
   closed mid-flight, so a failure has to be visible rather than swallowed. */
let writeChain = Promise.resolve();
let writeError = null;
/* Declared up here rather than beside the ear code that sets it, because
   renderWarning reads it and `typeof` is no protection against a temporal
   dead zone — it throws for a `let` that has not been reached yet. */
let earLoadError = null;

function queueWrite(key, state, entry){
  writeChain = writeChain
    .then(() => save(key, state, entry))
    .then(() => { writeError = null; })
    .catch(e => { writeError = e; console.error("save failed", e); })
    .finally(renderWarning);
  return writeChain;
}

function renderWarning(){
  const banners = [];
  if (PEEK) {
    banners.push(`<p class="warn">Looking at <b>${esc(uid)}</b>'s deck as he ` +
      `would see it. Nothing here is saved — grade freely, reload to reset.</p>`);
  } else if (TEST_MODE) {
    banners.push(`<p class="warn">Test session — nothing is saved. ` +
      `Reload to start over.</p>`);
  }
  if (writeError) {
    banners.push(`<p class="warn err">Not saving. The last review did not reach ` +
      `the server (${writeError.message}). Check your connection — progress from ` +
      `here on may be lost.</p>`);
  }
  if (earLoadError) {
    banners.push(`<p class="warn err">Ear training is unavailable — could not ` +
      `read ear/manifest.json (${earLoadError}). Vocab is unaffected.</p>`);
  }
  const bytes = logBytes();
  if (bytes >= DOC_LIMIT * WARN_AT) {
    const pct = Math.round(bytes / DOC_LIMIT * 100);
    banners.push(`<p class="warn">Review log is at ~${pct}% of the 1 MiB ` +
      `Firestore document limit (${reviewLog.length} entries). Trim or archive it.</p>`);
  }
  warnEl.innerHTML = banners.join("");
}

const barEl = $("#bar");
let sessionDone = 0;

/* Extra study. He asked for a way to do more on a day he feels like it,
   without it becoming a second obligation, so it appears only once the day is
   already finished and it is never offered as something outstanding.

   New cards save; practice reviews do not. The asymmetry is the whole design:
   introducing a word is real progress and should stick, but grading a card
   days before it is due corrupts the interval — a "Good" answered early was
   measured at the wrong point and the scheduler cannot tell. Ear training has
   no such problem, which is why an extra ear block would count normally.

   `extraSaves` is fixed when the session opens rather than tested per grade,
   so a card cannot start as practice and become savable by being answered
   twice. */
let extraMode = false;
let extraSaves = new Set();
const EXTRA_NEW = 3;
const EXTRA_PRACTICE = 12;

function midnight(ms){ const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }

/* Everything the two summary screens show, derived from state rather than
   tracked separately, so it cannot drift from what the queue actually does. */
function stats(){
  const withState = allCards.filter(k => cardStates[k]);
  /* A retired card keeps its state and still counts as started — he did
     learn it — but it is not due, and it must not be what `nextDue` points
     at, or the closing screen would tell him to come back in eight months. */
  const live = withState.filter(k => !cardRetired(k));
  const future = live.filter(k => cardStates[k].due > t).map(k => cardStates[k].due);
  const days = [...new Set(reviewLog.map(e => midnight(e.ts)))].sort((a, b) => b - a);
  let streak = 0;
  if (days.length && (days[0] === t || days[0] === t - MS_DAY)) {
    streak = 1;
    for (let i = 1; i < days.length; i++) {
      if (days[i - 1] - days[i] !== MS_DAY) break;
      streak++;
    }
  }
  return {
    due: live.filter(k => cardStates[k].due <= t).length,
    fresh: fresh.length,
    locked: lockedCount,
    started: withState.length,
    total: allCards.length,
    notes: Object.keys(NOTES).length,
    startedNotes: new Set(withState.map(noteOf)).size,
    retired: withState.length - live.length,
    todayReviews: reviewLog.filter(e => e.ts >= t).length,
    nextDue: future.length ? Math.min(...future) : null,
    streak,
  };
}

function row(label, value, cls){
  return `<dt>${label}</dt><dd class="${cls || ""}">${value}</dd>`;
}

function renderCount(){
  const left = queue.length;
  const total = sessionDone + left;
  countEl.textContent = total ? `${sessionDone} / ${total}` : "";
  barEl.className = total ? "on" : "";
  barEl.firstElementChild.style.width = total ? `${(sessionDone / total) * 100}%` : "0";
}

function renderDone(){
  countEl.textContent = "";
  barEl.className = "";
  renderWarning();
  const st = stats();
  if (sessionDone && !extraMode) markDone(vocabLight ? "vocab-light" : "vocab");
  const earLeft = earPending();
  // Vocab-only: an ear trial is not a card reviewed, and this screen is
  // reporting on the session he has just finished.
  const today = reviewLog.filter(e => e.ts >= t && !e.card.endsWith("__ear"));
  const good = today.filter(e => e.grade === "good").length;
  const rate = today.length ? Math.round((good / today.length) * 100) : null;

  /* What he should leave with, in order: you are finished, well done, come
     back on this day. Locked cards are deliberately last, small and grey —
     it is not something he can act on, and reading it as a backlog would be
     discouraging. */
  const when = st.nextDue == null ? null
             : Math.round((midnight(st.nextDue) - t) / MS_DAY);
  const back = when == null
    ? "Add some words and come back."
    : when <= 1 ? "Come back tomorrow." : `Come back in ${when} days.`;

  appEl.innerHTML = `
    <div class="stats done">
      <p class="done-h">${!sessionDone ? "Nothing due right now"
        : extraMode ? "Extra practice done"
        : earLeft ? "That's vocab done for today" : "That's everything for today"}</p>
      ${sessionDone ? `<p class="done-sub">${extraMode
        ? "The new words are saved. The practice was just practice."
        : "Nice work."}</p>` : ""}
      <p class="done-cta">${esc(back)}</p>
      ${today.length ? `
      <dl class="rows small">
        ${row("Reviewed today", today.length)}
        ${rate !== null ? row("Got it first time", rate + "%") : ""}
        ${st.streak > 1 ? row("Days in a row", st.streak) : ""}
        ${row("Words started", `${st.startedNotes} of ${st.notes}`)}
        ${st.retired ? row("Finished for good", st.retired) : ""}
      </dl>` : ""}
      ${st.locked ? `<p class="aside">${st.locked} card${st.locked === 1 ? "" : "s"} ` +
        `waiting in the wings (nothing to do about those — they turn up on ` +
        `their own once a word is solid).</p>` : ""}
    </div>
    ${earLeft
      ? `<button class="reveal" id="cross">Ear training · about ${earMins(earLeft)}</button>`
      : `<button class="reveal alt" id="home">Back</button>`}
    ${(!earLeft && !extraMode && extraAvailable())
      ? `<button class="lighter" id="go-extra">Feel like more? ` +
        `${EXTRA_NEW} new words and some practice</button>` : ""}`;
  const cross = $("#cross");
  if (cross) cross.addEventListener("click", startEar);
  const home = $("#home");
  if (home) home.addEventListener("click", renderLanding);
  const gx = $("#go-extra");
  if (gx) gx.addEventListener("click", startExtra);
}

/* ── rendering ──────────────────────────────────────────────────────
   Grammatical labels are Polish and abbreviated the way a Polish
   dictionary does it. Every media element is optional: a note with no
   image or audio simply renders without one, so the deck stays usable
   while the media pipeline catches up. */
const POS_PL = {
  noun: "rzeczownik", verb: "czasownik", adjective: "przymiotnik",
  adverb: "przysłówek", preposition: "przyimek", conjunction: "spójnik",
  particle: "partykuła", pronoun: "zaimek", interjection: "wykrzyknik",
  numeral: "liczebnik",
};

// Anything from the deck could contain < or &; it is rendered via innerHTML.
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Part of speech only. Declension tables and aspect pairs are deliberately
   not stored — this is a vocabulary trainer, not a grammar reference, and
   the example sentences are free to use whatever form reads naturally. */
function grammar(n){
  return `<div class="gram">${esc(POS_PL[n.pos] || n.pos)}</div>`;
}

let audioSeq = 0;
const audioBtns = [];
function playBtn(src, label, extra){
  if (!src) return "";
  const id = `play${audioSeq++}`;
  audioBtns.push({ id, src });
  return `<button class="play${extra ? " " + extra : ""}" id="${id}" ` +
         `aria-label="${esc(label)}">▶</button>`;
}
/* One Audio element per file, reused, and a bounded number of them.

   A fresh `new Audio(src)` per play exhausts the browser's media pool after a
   few dozen — WebKit is the strict one — and from then on playback fails
   silently while already-created elements carry on working. That is exactly
   the fault reported on 2026-08-30: sound fine at the start of a session,
   dead halfway through, fixed by reloading the page, which is the one thing
   that destroys every element. A 45-card session was creating well over a
   hundred, and autoPlay swallowed the resulting error so nothing said so.

   The ear trainer has always cached (earCache) and was never affected; vocab
   did not, and vocab is where it broke. */
/* One player element for the whole session, its src swapped per clip.

   There are two faults here and only the second explains why fixing the first
   did not help. A fresh `new Audio()` per play leaks media elements, and past
   the browser's cap new ones fail silently — that was the first diagnosis, and
   caching fixed it. It did not fix the symptom, because of the second fault:

   a media element may only play if `play()` has been called on it during a
   user gesture at least once. The preloader creates elements outside any
   gesture, so once caching made playback reuse a preloaded element, the tap
   was refused. It broke after a card or two — precisely when the preloader
   had got far enough ahead — rather than after sixty. Before caching, the
   click handler built a new element inside the gesture every time, which is
   always allowed, so the button had always worked.

   One element fixes both. It cannot exhaust a pool, and the first play that
   happens inside a tap unlocks it for the rest of the session. Preloading no
   longer needs a media element at all: fetch warms the same HTTP cache, and
   the player reads from it when it gets there. */
const player = new Audio();
player.preload = "auto";

function playSound(src){
  if (!src) return Promise.resolve();
  const abs = new URL(src, location.href).href;
  try { player.pause(); } catch (e) {}
  if (player.src !== abs) {
    player.src = src;
  } else {
    // Rewinding an element whose metadata has not arrived throws; a fresh
    // src does not need it anyway.
    try { player.currentTime = 0; } catch (e) {}
  }
  return player.play();
}
function autoPlay(src){
  if (!src) return;
  playSound(src).catch(() => {});   // blocked is fine, button remains
}

/* Media for the cards just behind this one. Without it every card fetches
   its own image at the moment it is drawn, which reads as a beat of blank
   space on the flip. The bytes are not the problem — 38 KB median — the
   round trip is, so what matters is starting it early rather than making it
   smaller. Three ahead keeps well in front of him without pulling a whole
   session down at once, and the set stops us asking twice. */
const PRELOAD_AHEAD = 3;
const preloaded = new Set();
function preload(url){
  if (!url || preloaded.has(url)) return;
  preloaded.add(url);
  if (/\.(webp|png|jpe?g|gif)$/i.test(url)) { new Image().src = url; return; }
  // Warm the HTTP cache without creating a media element. An element made
  // here could never be played anyway — see the player comment above.
  fetch(url, { cache: "force-cache" }).catch(() => {});
}
function preloadAhead(){
  for (const key of queue.slice(0, PRELOAD_AHEAD + 1)) {
    const n = NOTES[noteOf(key)];
    if (!n) continue;
    preload(n.image);
    preload(n.audio);
    preload((n.sentence || {}).audio);
  }
}

function wireAudio(){
  for (const { id, src } of audioBtns.splice(0)) {
    const el = $("#" + id);
    if (el) el.addEventListener("click", () => playSound(src).catch(e => {
      /* Every rejection here is worth reporting, NotAllowedError included.
         That name means "no user gesture", and this *is* the user's tap — so
         on this path it does not mean autoplay was blocked, it means the
         element itself was refused. Ignoring it is why a whole session could
         go silent with nothing on screen saying so: the student was told
         nothing, and neither were we. Only an abort from a clip being
         replaced is routine. */
      if (e.name !== "AbortError") {
        writeError = new Error(`audio failed (${e.name}): ${src}`);
        renderWarning();
      }
    }));
  }
}

/* ── the four card types ────────────────────────────────────────────
   Each note can produce up to four cards, each testing a different
   direction. Which pieces appear where is the whole design:

     recognition  PL word + audio + IPA  ->  meaning, image, sentence
     production   image + English        ->  the Polish word
     listening    the recording alone    ->  everything else

   Nothing is shown on a front that would give the answer away — the
   listening front is deliberately bare, and production withholds both the
   Polish word and its audio. */
const pieces = {
  word:    n => `<div class="front">${esc(n.word)}</div>`,
  ipa:     n => n.ipa ? `<div class="ipa">[${esc(n.ipa)}]</div>` : "",
  gloss:   n => `<div class="back">${esc(n.gloss)}</div>`,
  image:   n => n.image
    ? `<img src="${esc(n.image)}" alt="${esc(n.image_alt || "")}">` : "",
  note:    n => n.note ? `<div class="note">${esc(n.note)}</div>` : "",
  audio:   n => playBtn(n.audio, `play ${n.word}`),
  sentenceEn: n => (n.sentence && n.sentence.en)
    ? `<div class="sent-en">${esc(n.sentence.en)}</div>` : "",
  sentenceAudio: n => playBtn((n.sentence || {}).audio, "play the sentence"),
  sentence: n => (n.sentence && n.sentence.pl) ? `
    <div class="sent">
      <div class="sent-pl">${esc(n.sentence.pl)}${playBtn(n.sentence.audio, "play the sentence")}</div>
      <div class="sent-en">${esc(n.sentence.en || "")}</div>
    </div>` : "",
  gapped:  n => (n.sentence && n.sentence.gap) ? `
    <div class="sent"><div class="sent-gap">${esc(n.sentence.gap)}</div></div>` : "",
};

const LAYOUT = {
  /* A conjugation drill, not a vocabulary card. The bracketed cue names the
     verb, because "Dziecko ___ psa" takes jest or ma and a card with two
     right answers grades nothing. */
  form: {
    front: ["image", "formGap"],
    back:  ["formFull", "sentenceAudio", "sentenceEn", "image"],
  },
  recognition: {
    front: ["word", "audio", "ipa"],
    back:  ["word", "audio", "ipa", "gloss", "image", "sentence", "note"],
  },
  production: {
    front: ["image", "gloss", "note", "gapped"],
    back:  ["word", "audio", "ipa", "image", "gloss", "sentence", "note"],
  },
  listening: {
    front: ["audioOnly"],
    back:  ["word", "audio", "ipa", "gloss", "image", "sentence", "note"],
  },
};

// Fronts that are not simply a stack of the shared pieces.
const special = {
  formGap:  n => `<div class="cloze">${esc((n.sentence || {}).gap || "")}` +
    (n.parent && NOTES[n.parent] ? ` <em class="cue">(${esc(NOTES[n.parent].word)})</em>` : "") +
    `</div>`,
  formFull: n => {
    const s = n.sentence || {};
    return `<div class="cloze">${esc(s.gap || "").replace("___",
      `<b>${esc(s.answer || "")}</b>`)}</div>`;
  },
  // Deliberately not "play <word>": the label is the answer.
  audioOnly: n => playBtn(n.audio, "play the recording", "play-big"),
};

/* Every front says what it is asking. Production especially: an image and an
   English word look exactly like a comprehension card until you notice you
   are meant to produce the Polish. */
const TASK = {
  form:        "Wpisz słowo — fill in the gap",
  recognition: "What does this mean?",
  production:  "How do you say this in Polish?",
  listening:   "What does this word mean?",
};
/* The listening card has nothing to read. A silent phone would make it look
   broken rather than hard, so say where the question is. */
const SUBTASK = {
  listening: "This card is sound only — turn your volume up.",
};

function side(n, type, which){
  const names = (LAYOUT[type] || LAYOUT.recognition)[which];
  const body = names.map(k => (special[k] || pieces[k])(n)).join("\n      ");
  const task = which === "front" && TASK[type]
    ? `<div class="task">${esc(TASK[type])}</div>\n      ` : "";
  const sub = which === "front" && SUBTASK[type]
    ? `<div class="task-sub">${esc(SUBTASK[type])}</div>\n      ` : "";
  return task + sub + body;
}

function renderCard(){
  revealed = false;
  current = queue[0];
  const n = NOTES[noteOf(current)];
  const type = typeOf(current);
  renderCount();
  renderWarning();
  appEl.innerHTML = `
    <div class="card">
      ${side(n, type, "front")}
    </div>
    <button class="reveal" id="reveal">Show answer</button>
  `;
  wireAudio();
  preloadAhead();
  // Sticky user activation from the previous tap usually lets this through;
  // if the browser refuses, the button is still there. See wireAudio.
  if (type === "listening" || type === "recognition") autoPlay(n.audio);
  $("#reveal").addEventListener("click", showBack);
}

function showBack(){
  if (revealed) return;
  revealed = true;
  const n = NOTES[noteOf(current)];
  const type = typeOf(current);
  appEl.innerHTML = `
    <div class="card">
      ${side(n, type, "back")}
      ${grammar(n)}
    </div>
    <div class="grades">
      <button class="g-again" id="again">Again</button>
      <button class="g-good" id="good">Good</button>
    </div>
  `;
  wireAudio();
  autoPlay((n.sentence || {}).audio);
  $("#again").addEventListener("click", () => grade("again"));
  $("#good").addEventListener("click", () => grade("good"));
}

function grade(g){
  const key = queue.shift();
  const isNew = !cardStates[key];
  const next = schedule(cardStates[key] || newCardState(), g, key);
  // Stamped whichever way it was graded — it was still introduced today.
  if (isNew) next.introduced = today();

  sessionDone++;
  /* A practice review is not a review. It changes nothing — not the stored
     card, not the one in memory, and not the log.

     Leaving it out of the log matters because progress.py buckets the log by
     grade for the streak, the day counts and the accuracy, so a card answered
     out of turn would corrupt all three; that is why hint opens have their own
     field too. Leaving cardStates alone matters for a quieter reason: the
     schedule is computed from the current state, so a practice answer that
     moved it in memory would silently become the starting point for the next
     real answer in the same page session. */
  if (!extraMode || extraSaves.has(key)) {
    cardStates[key] = next;
    const entry = { card: key, grade: g, ts: Date.now() };
    reviewLog.push(entry);
    queueWrite(key, next, entry);
  }

  /* Bury siblings. A note's other cards test the same word from another
     angle, and having just seen the answer he would pass them on recall of
     the last ten seconds rather than of the word — which teaches the
     scheduler the wrong thing. They come back tomorrow. Done before the
     "again" splice below, since that card is its own sibling. */
  queue = queue.filter(k => noteOf(k) !== noteOf(key));

  if (g === "again") {
    // resurface later this session rather than only tomorrow
    queue.splice(Math.min(queue.length, 3), 0, key);
  }

  queue.length ? renderCard() : renderDone();
}


/* ══ ear training ══════════════════════════════════════════════════
   The second mode: forced-choice minimal pairs. Deliberately a separate
   session rather than cards spliced into the vocab queue. The two
   interaction models are opposites — a flashcard is revealed and
   self-graded, a minimal pair is tapped and graded automatically — and
   they want different schedulers. SM-2 pushes a known item toward long
   maintenance intervals, which is exactly wrong for a perceptual skill
   measured across many exemplars.

   Everything below reads and writes `earStates` and `doneDays`, never
   `cardStates`, so none of the vocab machinery can be disturbed by it.
   Burying is not a concern for the same reason: kasa exists as both a
   vocab note and an ear word, but an ear trial never touches `queue`. */

const SOUND_IPA   = { s:"/s/", sz:"/ʂ/", si:"/ɕ/", c:"/t͡s/", cz:"/t͡ʂ/", ci:"/t͡ɕ/" };
/* Unused in the app — tools/progress.py parses it out of this file to label
   the rows and columns of the confusion matrix. Deleting it as dead code
   breaks the report, so it lives here next to the sounds it names. */
const SOUND_LABEL = { s:"s", sz:"sz", si:"ś", c:"c", cz:"cz", ci:"ć" };

/* Every unordered pair inside a set. A row of three like kos/kosz/koś is
   three contrasts, not one three-way question: s vs sz is a different skill
   from s vs ś, and only pair-level tracking can see which one he is failing
   — or aim the next trial at it. A three-way trial also only half-reports:
   a miss says which confusion, but a hit says merely that he avoided both. */
const PAIRS = SETS.flatMap(set =>
  set.flatMap((a, i) => set.slice(i + 1).map(b => [a, b])));
const pairKey = p => [...p].sort().join("|");

/* Recordings. A pair is playable only when both its words have audio, so a
   new contrast can ship in WORDS/SETS and go live the day the recordings
   land, with no code change. Missing audio for *some* pairs is the normal
   state; failing to read the manifest at all is not, and says so. */
let REC = {};
try {
  const res = await fetch("ear/manifest.json", { cache: "no-cache" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  REC = (await res.json()).words || {};
} catch (e) {
  earLoadError = e.message;
}
const recsFor = id => REC[id] || [];
const livePairs = PAIRS.filter(p => p.every(id => recsFor(id).length));

const EAR_TRIALS  = 20;   // a full session
const EAR_MIN     = 6;    // never offer a session shorter than this
const EAR_WINDOW  = 10;   // trailing outcomes kept per pair
const EAR_RETIRE  = 9;    // correct out of that window
const MAINT_EVERY = 3;    // days between maintenance blocks once all retired
const SEC_PER_TRIAL = 8;

const earOf = k => earStates[k] || { seen: 0, hist: [], last: 0 };
const earScore = s => s.hist.reduce((a, b) => a + b, 0);

function retired(k){
  const s = earOf(k);
  return s.hist.length >= EAR_WINDOW && earScore(s) >= EAR_RETIRE;
}
const activePairs = () => livePairs.filter(p => !retired(pairKey(p)));

/* Length is set by trial count, never by mastery. Struggling changes *what*
   he is shown, never *how much*: if "done" meant clearing the failing pairs,
   a bad day would get longer exactly when he is having the worst time.
   The block does shrink as pairs retire — that is the reward. */
function earPlan(){
  if (!livePairs.length) return null;
  const active = activePairs();
  if (active.length) {
    return { pool: active, maint: false,
      n: Math.max(EAR_MIN, Math.min(EAR_TRIALS,
        Math.round(EAR_TRIALS * active.length / livePairs.length))) };
  }
  /* Zero case: everything has retired. Never offer a mode that cannot be
     filled — but never make a settled contrast a daily chore either. A short
     block from the pairs he has not heard in longest, at most every third
     day; on the other days the landing shows ear training as satisfied. */
  if (!maintenanceDue()) return null;
  const cold = [...livePairs].sort(
    (a, b) => earOf(pairKey(a)).last - earOf(pairKey(b)).last);
  return { pool: cold.slice(0, EAR_MIN), n: EAR_MIN, maint: true };
}

function lastEarDay(){
  const days = Object.entries(doneDays)
    .filter(([, m]) => m.includes("ear")).map(([d]) => Number(d));
  return days.length ? Math.max(...days) : null;
}
function maintenanceDue(){
  const last = lastEarDay();
  return last === null || (t - last) >= MAINT_EVERY * MS_DAY;
}

/* Weighted toward whatever he is currently getting wrong. A pair he mostly
   gets right still turns up, just less often than one he is guessing at. */
function weightedPair(pool){
  const w = pool.map(p => {
    const s = earOf(pairKey(p));
    return 0.25 + (1 - (s.hist.length ? earScore(s) / s.hist.length : 0.5));
  });
  let r = rand() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) if ((r -= w[i]) <= 0) return pool[i];
  return pool[pool.length - 1];
}

// Nothing asked twice running while another contrast is still available.
function deadjacent(arr, key){
  for (let i = 1; i < arr.length; i++) {
    if (key(arr[i]) !== key(arr[i - 1])) continue;
    const j = arr.findIndex((x, k) => k > i && key(x) !== key(arr[i]));
    if (j > i) [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildEarQueue(plan){
  // Every pair in the pool is guaranteed one appearance before anything
  // repeats; only the remainder is drawn weighted.
  const picks = shuffle([...plan.pool]).slice(0, plan.n);
  while (picks.length < plan.n) picks.push(weightedPair(plan.pool));
  return deadjacent(shuffle(picks), pairKey).map(p => {
    const target = p[Math.floor(rand() * 2)];
    return { pair: p, key: pairKey(p), target,
             other: p[0] === target ? p[1] : p[0],
             opts: shuffle([...p]), rec: pickRec(target) };
  });
}

function pickRec(id){
  const r = recsFor(id);
  return r.length ? r[Math.floor(rand() * r.length)] : null;
}
/* For the listen-to-both comparison: the same speaker as the target where
   the recordings allow it, so the only thing differing is the sound. */
function matchRec(id, spk){
  const r = recsFor(id);
  if (!r.length) return null;
  const same = spk ? r.filter(x => x.spk === spk) : [];
  const pool = same.length ? same : r;
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ── ear persistence ─────────────────────────────────────────────────
   `ear` keys carry "|" and "-" and `done` keys are bare digits, none of
   which are legal in an unquoted dotted field path — hence FieldPath. */
async function saveEar(key, state, entry){
  if (READ_ONLY) return;
  if (!docExists) return firstWrite();
  await write.update(docRef,
    new FieldPath("ear", key), state,
    "log", arrayUnion(entry),
    "logBytes", logBytes(),
    "updated", Date.now());
}

function queueEarWrite(key, state, entry){
  writeChain = writeChain
    .then(() => saveEar(key, state, entry))
    .then(() => { writeError = null; })
    .catch(e => { writeError = e; console.error("save failed", e); })
    .finally(renderWarning);
  return writeChain;
}

function markDone(mode){
  const day = String(t);
  const list = new Set(doneDays[day] || []);
  if (list.has(mode)) return;
  list.add(mode);
  doneDays[day] = [...list];
  // A few bytes a day, but it should not grow forever.
  for (const d of Object.keys(doneDays))
    if (t - Number(d) > 90 * MS_DAY) delete doneDays[d];
  if (READ_ONLY) return;
  writeChain = writeChain
    .then(() => docExists
      ? write.update(docRef, "done", doneDays, "updated", Date.now())
      : firstWrite())
    .then(() => { writeError = null; })
    .catch(e => { writeError = e; console.error("save failed", e); })
    .finally(renderWarning);
}

function recordEar(tr, chosen, ok){
  const prev = earOf(tr.key);
  const was = retired(tr.key);
  const st = { seen: prev.seen + 1, last: Date.now(),
               hist: [...prev.hist, ok ? 1 : 0].slice(-EAR_WINDOW) };
  /* A retired pair that fails starts its window again. Without this, 10/10
     followed by a miss is still 9/10 and the pair never actually comes back
     — "any miss un-retires it" has to mean something. */
  if (was && !ok) st.hist = [0];
  earStates[tr.key] = st;

  /* One log shape for both modes. Keying `<word>__ear` matches the existing
     `${noteId}__${cardType}` convention, and keeping `grade` means the day
     buckets, the streak and the sittings split in tools/progress.py keep
     working untouched. `chose` is what powers the confusion matrix, and `vs`
   names the distractor: on a correct answer chose == played, so without it
   the pair a trial belonged to would be unrecoverable from the log and only
   the ten-trial window in `ear` could say anything about it. */
  const entry = { card: `${tr.target}__ear`, grade: ok ? "good" : "again",
                  ts: Date.now(), chose: chosen, vs: tr.other };
  reviewLog.push(entry);
  queueEarWrite(tr.key, st, entry);
}

/* ── ear rendering ─────────────────────────────────────────────────── */
const modeLabel = $("#mode-label");
const BARS = Array.from({ length: 44 }, (_, i) =>
  `<span style="height:${18 + Math.round(34 * Math.abs(Math.sin(i * 1.9)))}%;` +
  `animation-delay:${(i % 7) * 60}ms"></span>`).join("");

const spell = id => WORDS[id].w.join("");
const wordHtml = id => {
  const W = WORDS[id];
  return `${esc(W.w[0])}<mark>${esc(W.w[1])}</mark>${esc(W.w[2])}`;
};

const earCache = new Map();
function playRec(rec, cb){
  const p = $("#player");
  if (!rec) { if (cb) cb(); return; }
  if (p) p.classList.add("playing");
  const done = () => { if (p) p.classList.remove("playing"); if (cb) cb(); };
  let a = earCache.get(rec.f);
  if (!a) { a = new Audio(rec.f); earCache.set(rec.f, a); }
  a.onended = done;
  a.onerror = done;
  a.currentTime = 0;
  const pr = a.play();
  if (pr && pr.catch) pr.catch(done);
}

let earQueue = [], earIdx = 0, earTrial = null, earAnswered = false;
let earMarks = [], earLog = [];

function startEar(){
  const plan = earPlan();
  if (!plan) return renderLanding();
  earQueue = buildEarQueue(plan);
  earIdx = 0; earMarks = []; earLog = [];
  renderEarTrial();
}

function renderEarTrial(){
  earTrial = earQueue[earIdx];
  earAnswered = false;
  modeLabel.textContent = "Ear training";
  countEl.textContent = `${earIdx + 1} / ${earQueue.length}`;
  barEl.className = "on";
  barEl.firstElementChild.style.width = `${(earIdx / earQueue.length) * 100}%`;
  renderWarning();
  appEl.innerHTML = `
    <div class="ticks">${earQueue.map((_, i) =>
      `<i class="${earMarks[i] || ""}"></i>`).join("")}</div>
    <button class="player" id="player">
      <span class="bars">${BARS}</span>
      <span class="player-label">Tap to play again</span>
    </button>
    <div class="opts">${earTrial.opts.map(id => `
      <button class="opt" data-id="${esc(id)}">
        <span class="opt-main">
          <span class="opt-word">${wordHtml(id)}</span>
          <span class="opt-gloss">${esc(WORDS[id].g)}</span>
        </span>
        <span class="opt-ipa">${SOUND_IPA[WORDS[id].s] || ""}</span>
      </button>`).join("")}</div>
    <p class="verdict" id="verdict"></p>
    <div class="compare" id="compare" style="display:none"></div>
    <button class="reveal" id="ear-next" style="display:none">Next</button>`;
  appEl.querySelectorAll(".opt").forEach(b =>
    b.addEventListener("click", () => answerEar(b.dataset.id)));
  $("#player").addEventListener("click", () => playRec(earTrial.rec));
  $("#ear-next").addEventListener("click", nextEarTrial);
  addHintBtn();
  playRec(earTrial.rec);
  // Same round trip, one trial ahead. Clips are a few KB; the wait is not.
  for (const tr of earQueue.slice(earIdx + 1, earIdx + 1 + PRELOAD_AHEAD)) {
    if (tr.rec) preload(tr.rec.f);
    preload((recsFor(tr.other)[0] || {}).f);   // the listen-to-both partner
  }
}

function answerEar(chosen){
  if (earAnswered) return;
  earAnswered = true;
  const ok = chosen === earTrial.target;
  earMarks[earIdx] = ok ? "hit" : "miss";
  earLog.push({ target: earTrial.target, chosen, ok });
  recordEar(earTrial, chosen, ok);

  appEl.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.id === earTrial.target) b.classList.add("correct");
    else if (b.dataset.id === chosen) b.classList.add("wrong");
    else b.classList.add("faded");
  });
  appEl.querySelector(".ticks").children[earIdx].className = earMarks[earIdx];

  const v = $("#verdict");
  if (ok) {
    v.textContent = "Correct";
    v.className = "verdict ok";
    const at = earIdx;
    setTimeout(() => { if (earIdx === at && earAnswered) nextEarTrial(); }, 800);
    return;
  }
  v.textContent = "Listen to both";
  v.className = "verdict bad";
  const cmp = matchRec(chosen, earTrial.rec ? earTrial.rec.spk : null);
  const c = $("#compare");
  c.innerHTML =
    `<button data-role="target"><span class="lbl">played</span>` +
      `<span class="wd">${esc(spell(earTrial.target))}</span></button>` +
    `<button data-role="chosen"><span class="lbl">you tapped</span>` +
      `<span class="wd">${esc(spell(chosen))}</span></button>`;
  c.style.display = "flex";
  c.querySelectorAll("button").forEach(b => b.addEventListener("click", () =>
    playRec(b.dataset.role === "target" ? earTrial.rec : cmp)));
  $("#ear-next").style.display = "block";
  playRec(earTrial.rec, () => setTimeout(() => playRec(cmp), 550));
}

function nextEarTrial(){
  earIdx++;
  earIdx >= earQueue.length ? renderEarDone() : renderEarTrial();
}

function renderEarDone(){
  markDone("ear");
  modeLabel.textContent = "Polish";
  countEl.textContent = "";
  barEl.className = "";
  renderWarning();
  const hits = earLog.filter(x => x.ok).length;
  const missed = earLog.filter(x => !x.ok);
  const vocabLeft = vocabPending();
  appEl.innerHTML = `
    <div class="stats done">
      <p class="done-h">${hits} of ${earLog.length}</p>
      <p class="done-sub">${missed.length ? "Nice work." : "Nothing missed."}</p>
      ${missed.length ? `<table class="missed">${missed.map(m =>
        `<tr><td>${esc(spell(m.target))}</td>` +
        `<td>heard as ${esc(spell(m.chosen))}</td></tr>`).join("")}</table>` : ""}
    </div>
    ${vocabLeft
      ? `<button class="reveal" id="cross">Vocab · ${vocabLeft} card${vocabLeft === 1 ? "" : "s"} due</button>`
      : `<button class="reveal alt" id="home">Done for today</button>`}`;
  const cross = $("#cross");
  if (cross) cross.addEventListener("click", () => startVocab(false));
  const home = $("#home");
  if (home) home.addEventListener("click", renderLanding);
  addHintBtn();
}

/* ══ the sibilant reminder ═════════════════════════════════════════
