   Written articulatory instruction is thin for a contrast he cannot yet
   hear, and the recordings are already here — so the reminder carries the
   sounds rather than only describing them.

   A `?` in the top bar rather than a sidebar: he uses this on a phone, where
   there is no horizontal room and a persistent panel would compete with the
   answer buttons. It opens over everything and is available *during* a trial,
   not only between: it is reference, not an answer, and nothing in it says
   which word was just played. */
const HINT_SETS = [["kasa", "kasia", "kasza"], ["wies-acute", "wiesz"]];

function hintClip(id){
  const r = recsFor(id);
  return r.length ? r[Math.floor(rand() * r.length)] : null;
}

function countHintOpen(){
  const day = String(t);
  hintOpens[day] = (hintOpens[day] || 0) + 1;
  for (const d of Object.keys(hintOpens))
    if (t - Number(d) > 90 * MS_DAY) delete hintOpens[d];
  if (READ_ONLY) return;
  writeChain = writeChain
    .then(() => docExists
      ? write.update(docRef, new FieldPath("hints", day), hintOpens[day],
                     "updated", Date.now())
      : firstWrite())
    .then(() => { writeError = null; })
    .catch(e => { writeError = e; console.error("save failed", e); })
    .finally(renderWarning);
}

function openHint(){
  countHintOpen();
  const row = (sym, dutch, how) => `
    <div class="snd-row"><b>${sym}</b><span class="d">${dutch}<br><em>${how}</em></span></div>`;
  const trio = ids => `<div class="three-up">${ids.map(id => {
      const W2 = WORDS[id];
      return `<button data-w="${esc(id)}"><span class="w">${wordHtml(id)}</span>` +
             `<span class="s">${esc(W2.g)}</span></button>`;
    }).join("")}</div>`;
  const el = document.createElement("div");
  el.className = "sheet";
  el.innerHTML = `
    <div class="sheet-in">
      <h3>Pools maakt twee klanken waar Nederlands er één heeft</h3>
      ${row("s", "zoals <b>sok</b>, <b>huis</b>", "hoog en scherp — deze kun je al")}
      ${row("ś", "begin met <b>sj</b>, tongpunt omlaag, tongmidden omhoog",
            "helder, dun en hoog")}
      ${row("sz", "begin met <b>sj</b>, tong naar achteren",
            "lager, donkerder en holler")}
      <p style="color:var(--dim);font-size:.8rem;line-height:1.5">Bij <b>sz</b> staan
      je lippen vaak iets naar voren, bij <b>ś</b> niet. Handig voor de spiegel als je
      zelf oefent — maar je kunt er niet aan zien welke klank iemand anders zegt.</p>
      <h3>Alle drie naast elkaar — tik om te horen</h3>
      ${trio(HINT_SETS[0])}
      <h3>En het moeilijke paar</h3>
      ${trio(HINT_SETS[1])}
      <p style="margin-top:1rem;color:var(--dim);font-size:.82rem">Let niet op hoe hard
      het sist — luister naar de toonhoogte en de klankkleur.</p>
      <button class="close" id="hint-close">Terug</button>
    </div>`;
  document.body.appendChild(el);
  el.querySelectorAll("[data-w]").forEach(b =>
    b.addEventListener("click", () => playRec(hintClip(b.dataset.w))));
  el.querySelector("#hint-close").addEventListener("click", () => el.remove());
}

/* Appended to the bottom of whatever was just rendered, rather than living in
   the top bar. A `?` beside the eyebrow was easy to miss on a phone; this sits
   where the thumb already is and says what it is for. */
function addHintBtn(){
  if (!livePairs.length) return;
  const b = document.createElement("button");
  b.className = "hint-btn";
  b.id = "hint";
  b.innerHTML = "Hint — <b>s · sz · ś</b>";
  b.addEventListener("click", openHint);
  appEl.appendChild(b);
}

/* ══ landing ═══════════════════════════════════════════════════════
   Two buttons, each stating its size so he knows what he is committing
   to. A satisfied mode is greyed and not tappable: tapping into a mode
   and landing on "nothing due" reads as broken rather than finished. */

function startVocab(light){
  vocabLight = !!light;
  queue = light ? [...dueCards] : interleave(dueCards, fresh);
  modeLabel.textContent = "Vocab";
  renderCard();
}

/* Extra study — offered only once the day is already done, so "finished"
   keeps meaning finished and this never reads as something outstanding.

   Three genuinely new words, which save, plus practice on the cards he is
   weakest at, which do not. Weakest rather than soonest-due: nothing is being
   scheduled here, so the only question is where the repetition does most
   good, and that is the low-ease cards. */
function extraPlan(){
  const fresh3 = bankOrder(shuffle([...allCards]))
    .filter(k => !cardStates[k] && introducible(k) && unlocked(k))
    .filter((k, i, all) => all.findIndex(j => noteOf(j) === noteOf(k)) === i)
    .slice(0, EXTRA_NEW);
  const practice = Object.keys(cardStates)
    .filter(k => NOTES[noteOf(k)] && !fresh3.includes(k) && !cardRetired(k))
    .sort((a, b) => (cardStates[a].ease || 2.5) - (cardStates[b].ease || 2.5))
    .slice(0, EXTRA_PRACTICE);
  return { fresh3, practice };
}

function extraAvailable(){
  const { fresh3, practice } = extraPlan();
  return fresh3.length + practice.length;
}

function startExtra(){
  const { fresh3, practice } = extraPlan();
  extraMode = true;
  extraSaves = new Set(fresh3);       // fixed now, not re-tested per grade
  sessionDone = 0;
  vocabLight = false;
  queue = interleave(shuffle(practice), fresh3);
  countExtraRun();
  modeLabel.textContent = "Extra";
  renderCard();
}

function countExtraRun(){
  const day = String(t);
  extraRuns[day] = (extraRuns[day] || 0) + 1;
  for (const d of Object.keys(extraRuns))
    if (t - Number(d) > 90 * MS_DAY) delete extraRuns[d];
  if (READ_ONLY) return;
  writeChain = writeChain
    .then(() => docExists
      ? write.update(docRef, new FieldPath("extra", day), extraRuns[day],
                     "updated", Date.now())
      : firstWrite())
    .then(() => { writeError = null; })
    .catch(e => { writeError = e; console.error("save failed", e); })
    .finally(renderWarning);
}

const vocabDone = () => {
  const d = doneDays[String(t)] || [];
  return d.includes("vocab") ? "full" : d.includes("vocab-light") ? "light" : null;
};

function vocabPending(){
  // Read from `done`, not from the queue: after a light session the new cards
  // are still sitting in `fresh`, and a reload would otherwise re-offer them.
  return vocabDone() ? 0 : queue.length;
}
function earPending(){
  if ((doneDays[String(t)] || []).includes("ear")) return 0;
  const plan = earPlan();
  return plan ? plan.n : 0;
}
const earMins = n => `${Math.max(1, Math.round(n * SEC_PER_TRIAL / 60))} minutes`;

function earIdleLabel(){
  if ((doneDays[String(t)] || []).includes("ear")) return "✓ done today";
  if (earLoadError) return "audio unavailable";
  if (!livePairs.length) return "no recordings yet";
  return "✓ settled";
}

function renderLanding(){
  modeLabel.textContent = "Polish";
  countEl.textContent = "";
  barEl.className = "";
  renderWarning();
  const s = stats();
  const v = vocabPending(), e = earPending();
  const light = v && dueCards.length && fresh.length;
  // When both are open, ear training leads: it is short, it is a warm-up,
  // and there is no did-I-remember-this pressure in it.
  const tile = (id, name, sub, lead) =>
    `<button class="mode${lead ? " lead" : ""}" id="${id}">` +
    `<span class="mode-n">${name}</span><span class="mode-sub">${esc(sub)}</span></button>`;
  const idle = (name, sub) =>
    `<div class="mode is-done"><span class="mode-n">${name}</span>` +
    `<span class="mode-sub">${esc(sub)}</span></div>`;

  const when = s.nextDue == null ? null
             : Math.round((midnight(s.nextDue) - t) / MS_DAY);
  const back = when == null ? "Add some words and come back."
             : when <= 1 ? "Come back tomorrow." : `Come back in ${when} days.`;

  appEl.innerHTML = `
    <div class="modes">
      ${v ? tile("go-vocab", "Vocab", `${v} card${v === 1 ? "" : "s"} due`, false)
          : idle("Vocab", vocabDone() === "full" ? "✓ done today"
                        : vocabDone() === "light" ? "✓ reviews only"
                        : "nothing due")}
      ${light ? `<button class="lighter" id="go-light">Tired? Just the ` +
        `${dueCards.length} review${dueCards.length === 1 ? "" : "s"}, no new words</button>` : ""}
      ${e ? tile("go-ear", "Ear training", `${e} trials · about ${earMins(e)}`, !!v)
          : idle("Ear training", earIdleLabel())}
    </div>
    ${(!v && !e) ? `<div class="stats done">
      <p class="done-h">All done for today</p>
      <p class="done-cta">${esc(back)}</p>
    </div>
    ${extraAvailable() ? `<button class="lighter" id="go-extra">Feel like more? ` +
      `${EXTRA_NEW} new words and some practice</button>` : ""}` : ""}
    <a class="lighter drill" href="sz.html">ś of sz — oefenen</a>
    <div class="stats">
      <h2>So far</h2>
      <dl class="rows">
        ${row("Words started", `${s.startedNotes} of ${s.notes}`)}
        ${row("Cards started", `${s.started} of ${s.total}`)}
        ${s.streak ? row("Days in a row", s.streak) : ""}
        ${s.todayReviews ? row("Answered today", s.todayReviews) : ""}
      </dl>
    </div>`;
  const gv = $("#go-vocab");
  if (gv) gv.addEventListener("click", () => startVocab(false));
  const gl = $("#go-light");
  if (gl) gl.addEventListener("click", () => startVocab(true));
  const ge = $("#go-ear");
  if (ge) ge.addEventListener("click", startEar);
  const gx = $("#go-extra");
  if (gx) gx.addEventListener("click", startExtra);
  addHintBtn();
}

/* ══ boot ══════════════════════════════════════════════════════════ */
// One-off rewrite so the folded legacy keys above are actually persisted.
if (migrated && docExists && !READ_ONLY) {
  try {
    await firstWrite();
  } catch (e) {
    showError("Couldn't migrate saved progress.\n\n" + e.message);
    throw e;
  }
}

renderLanding();
</script>
</body>
</html>
